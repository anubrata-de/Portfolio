# Rebuilds src/data/github-projects.json from the public repos on this account:
# new repos are added (and marked new for 30 days), changed ones updated, deleted
# or hidden ones removed. A change is committed, which makes Vercel redeploy the
# site; the profile README picks it up half an hour later.
name: Sync projects from GitHub

on:
  schedule:
    # twice a day (06:47 and 18:47 in India); GitHub can start scheduled runs late
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    # when the sync itself changes, run it straight away
    branches: [main]
    paths:
      - scripts/sync-projects.mjs
      - .github/workflows/sync-projects.yml

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the repos
        run: node scripts/sync-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-projects.json
          git commit -m "Sync projects from GitHub"
          git push
